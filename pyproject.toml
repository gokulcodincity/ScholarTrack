[project]
name = "scholartrack"
version = "0.1.0"
description = "ScholarTrack Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "beanie>=2.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.3",
    "motor>=3.7.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[tool.pyright]
extraPaths = ["backend"]

